<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Romaliya</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/menu.css">
</head>
<body>
    <!-- header -->
    <header class="header">
        <div class="header-box">
            <a class="logo" href="index.html">
                <img class="logo-img" src="images/logo.png" alt="Romaliya logo">
                <span class="logo-name">ROMALIYA</span>
            </a>

            <div class="header-right">
                <ul class="header-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a class="active" href="menu.html" aria-current="page">Menu</a></li>

        <section class="recommendations">
            <div class="dish" id="lobster">
                <h2>BUTTER-POACHED LOBSTER</h2>
            </div>
