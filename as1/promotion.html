<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotion | Romaliya</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/promotion.css">
</head>
<body>
    <!-- header -->
    <header class="header">
        <div class="header-box">
            <a class="logo" href="index.html">
                <img class="logo-img" src="images/logo.png" alt="Romaliya logo">
                <span class="logo-name">ROMALIYA</span>
            </a>

            <div class="header-right">
                <ul class="header-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="order.html">Order</a></li>
                    <li><a class="active" href="promotion.html" aria-current="page">Promotion</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="restaurant.html">Our Restaurant</a></li>
                </ul>
                <a class="cart" href="order.html">
                    <img src="images/ordericon.png" alt="View your order">
                </a>
            </div>
            <div class="header-icon">
                <img src="images/menu-icon.png" alt="Menu">
            </div>
        </div>
    </header>

    <main>
        <!-- promotion hero -->
        <section class="hero">
            <img class="hero-photo" src="images/promotion/hero.png" alt="Golden mocktails and an iced drink served in sugar-rimmed glasses">
            <div class="hero-box">
                <div class="hero-content">
                    <p class="small-title">FEATURED PROMOTION</p>
                    <h1>GOLDEN SUNSET<br>MOCKTAIL</h1>
                    <p class="hero-text">A refreshing blend of tropical fruits with sparkling soda, finished with a hint of citrus.</p>
                    <p class="hero-offer">Buy 1, Get 1 50% OFF</p>
                    <a class="btn" href="menu.html">DISCOVER MORE</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
